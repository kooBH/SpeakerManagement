---
task : "VVAD"
---
model:
  type : VVAD
  encoder : encoder
  architecture : {
    "encoder" : {
      "enc1" : {"in_channels":1,"out_channels":32, "kernel_size":[3,3,3], "stride":[2,2,2], "padding":[0,0,0]},
      "enc2" : {"in_channels":32,"out_channels":64, "kernel_size":[3,3,3], "stride":[2,2,2], "padding":[0,0,0]},
      "enc3" : {"in_channels":64,"out_channels":128, "kernel_size":[3,3,1], "stride":[2,2,1], "padding":[0,0,0]},
      "enc4" : {"in_channels":128,"out_channels":256, "kernel_size":[3,3,1], "stride":[2,2,1], "padding":[0,0,0]},
      "enc5" : {"in_channels":256,"out_channels":256, "kernel_size":[3,3,1], "stride":[2,2,1], "padding":[1,1,0]},
      "enc6" : {"in_channels":256,"out_channels":256, "kernel_size":[3,3,1], "stride":[1,1,1], "padding":[0,0,0]}
    },
    "TB" : {"n_feature":256,"drop_out":0.0},
    "labeler": {"n_feature":256}
  }
---
train:
  epoch: 200
  batch_size: 64
  num_workers: 32
  optimizer: 'adamW'
  adam: 0.0001
  adabound:
    initial: 0.001
    final: 0.05
  frame_num: 128
  summary_interval: 100
  validation_interval: 100
  checkpoint_interval: 1000
---
loss:
  type: 'BCELoss'
---
scheduler: # Plateau, oneCycle, CosineAnnealingLR
  type: 'CosineAnnealingLR'
  oneCycle:
    max_lr: 0.0001
  Plateau:
    mode: 'min'
    patience: 2
    factor: 0.5
    min_lr: 0.000005
  CosineAnnealingLR : 
    T_max : 20  # Maximum number of iterations.
    eta_min : 0.000001
---
data:
  VVAD : "/home/data/kbh/VVAD_LRS3/faceImages_small.h5"
---
log:
  root: '/home/nas/user/kbh/VVAD/logs'
---
aug:
  flip_p: 0.0
  rotate_p : 0.0
  rotate_angle : 30
  gaussian_p : 0.0
  sharpen_p : 0.0
  contrast_p : 0.0
  equalize_p : 0.0
  blur_p : 0.0
  perspective_p : 0.0